<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Routes & Schedules</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🚌 BusGo</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="routes.html" style="color: #0b3d91; font-weight: bold;">Routes</a>
        <a href="../admin/login.html" style="color: #d90429; font-weight: bold;">Admin Login</a>
        <a href="booking.html" class="nav-btn" style="background-color: #0b3d91;">Book Ticket</a>
    </div>
</nav>

<section class="page-header" style="padding: 40px 20px; min-height: auto;">
    <p>BUSGO</p>
    <h1>Available Transit Routes</h1>
    <span style="display: block; margin-top: 8px;">Explore our active origin and destination pathways</span>
</section>

<section class="routes-section" style="max-width: 900px; margin: 30px auto; padding: 0 15px;">
    <div id="routes-container" style="display: flex; flex-direction: column; gap: 15px;">
        <!-- Populated via API -->
    </div>
</section>

<footer>
    <div class="footer-logo">🚌 BusGo</div>
    <p>Bus Ticket Reservation System</p>
    <p class="copyright">© 2026 BusGo. All Rights Reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('../api/get_routes.php')
        .then(res => res.json())
        .then(data => {
            const routesContainer = document.getElementById('routes-container');
            if (!data || data.length === 0) {
                routesContainer.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">No routes available at the moment.</p>';
                return;
            }

            let routesHtml = '';
            data.forEach(route => {
                routesHtml += `
                    <div class="route-card" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 20px;">
                            <span style="font-size: 2rem;">🛣️</span>
                            <div>
                                <h3 style="color: #0b3d91; margin: 0 0 5px 0; font-size: 1.1rem;">${route.source} → ${route.destination}</h3>
                            </div>
                        </div>
                        <a href="index.html?source=${encodeURIComponent(route.source)}&destination=${encodeURIComponent(route.destination)}" class="view-btn" style="background: #0b3d91; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">View Buses</a>
                    </div>
                `;
            });
            routesContainer.innerHTML = routesHtml;
        })
        .catch(err => {
            console.error('Error fetching routes:', err);
            document.getElementById('routes-container').innerHTML = '<p style="text-align: center; color: red; padding: 20px;">Failed to load routes.</p>';
        });
});
</script>

</body>
</html>
