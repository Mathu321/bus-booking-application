<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo Admin - View Bookings</title>
    <link rel="stylesheet" href="../css/style.css?v=2">
    <style>
        .table-responsive {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
            padding: 24px;
            border: 1px solid #f1f5f9;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        .admin-table th, .admin-table td {
            padding: 16px 18px;
            border-bottom: 1px solid #f1f5f9;
        }
        .admin-table th {
            background-color: #f8fafc;
            color: #0b3d91;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.8px;
        }
        .admin-table tr {
            transition: background-color 0.2s ease;
        }
        .admin-table tr:hover {
            background-color: #f8fafc;
        }
        .badge-id {
            background-color: #f1f5f9;
            color: #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .badge-seat {
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #dbeafe;
        }
        .badge-cancelled {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #fecaca;
        }
        .action-btn {
            background-color: #fff1f2;
            color: #e11d48;
            border: 1px solid #ffe4e6;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background-color: #e11d48;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">🚌 BusGo Admin</div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="bookings.html" style="font-weight: bold; color: #0b3d91;">All Bookings</a>
        <a href="admin_bookings.html">My Bookings</a>
        <a href="../public/index.html" class="nav-btn" style="background-color: #d90429;">Logout</a>
    </div>
</nav>

<section class="bus-section" style="padding: 30px 20px;">
    <div class="section-heading" style="margin-bottom: 25px;">
        <p>CONTROL PANEL</p>
        <h2>Customer & Admin Bookings</h2>
    </div>
    
    <div class="table-responsive">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Passenger Name</th>
                    <th>Bus</th>
                    <th>Phone</th>
                    <th>Seats</th>
                    <th>Booked By</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookings-table-body">
                <!-- Loaded via API -->
            </tbody>
        </table>
    </div>
</section>

<footer>
    <div class="footer-logo">🚌 BusGo</div>
    <p>Bus Ticket Reservation System</p>
    <p class="copyright">© 2026 BusGo. All Rights Reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadAdminBookings();
});

function loadAdminBookings() {
    fetch('../api/admin_get_bookings.php')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('bookings-table-body');
            if(!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #777; padding: 30px;">No bookings found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(b => {
                const isCancelled = b.status === 'Cancelled';
                const seatBadge = isCancelled 
                    ? `<span class="badge-cancelled">Cancelled</span>` 
                    : `<span class="badge-seat">${b.seat_number}</span>`;

                const actionButton = isCancelled 
                    ? `<span style="color: #94a3b8; font-size: 0.85rem; font-weight: 500;">N/A</span>` 
                    : `<button class="action-btn" onclick="adminCancelTicket(${b.booking_id})">Cancel</button>`;

                return `
                    <tr style="opacity: ${isCancelled ? '0.65' : '1'};">
                        <td><span class="badge-id">#${b.booking_id}</span></td>
                        <td><strong>${b.passenger_name}</strong></td>
                        <td>${b.bus_name}</td>
                        <td>${b.phone}</td>
                        <td>${seatBadge}</td>
                        <td><span style="color: #475569; font-size: 0.9rem; font-weight: 500;">${b.booked_by ? 'Admin (' + b.booked_by + ')' : 'Passenger'}</span></td>
                        <td>${actionButton}</td>
                    </tr>
                `;
            }).join('');
        })
        .catch(err => {
            console.error('Error fetching bookings:', err);
            document.getElementById('bookings-table-body').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red; padding: 30px;">Error loading bookings.</td></tr>';
        });
}

function adminCancelTicket(bookingId) {
    if(!confirm('Are you sure you want to cancel this booking?')) return;

    fetch('../api/cancel_ticket.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({booking_id: bookingId})
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            alert('Booking cancelled successfully.');
            loadAdminBookings();
        } else {
            alert(data.message || 'Failed to cancel booking.');
        }
    });
}
</script>

</body>
</html>
