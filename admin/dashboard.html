<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>

<nav class="navbar">
    <div class="logo">🚌 BusGo Admin</div>
    <div class="nav-links">
        <a href="dashboard.html" style="font-weight: bold; color: #0b3d91;">Dashboard</a>
        <a href="bookings.html">All Bookings</a>
        <a href="admin_bookings.html">My Bookings</a>
        <a href="../public/index.html" class="nav-btn" style="background-color: #d90429;">Logout</a>
    </div>
</nav>

<!-- Add Admin Section Container -->
<section class="bus-section" style="max-width: 1000px; margin: 30px auto 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <div class="section-heading" style="margin-bottom: 15px;">
        <p style="color: #fca311; font-size: 0.85rem; font-weight: bold;">SECURITY</p>
        <h2 style="color: #0b3d91; font-size: 1.5rem;">Register New Administrator</h2>
    </div>
    <form onsubmit="createAdmin(event)" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
        <div class="input-group" style="flex: 1; min-width: 200px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;">New Admin Username</label>
            <input type="text" id="new_admin_username" placeholder="Enter username" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="input-group" style="flex: 1; min-width: 200px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;">Password</label>
            <input type="password" id="new_admin_password" placeholder="Enter password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <button type="submit" style="background-color: #0b3d91; color: white; border: none; height: 45px; padding: 0 25px; font-weight: bold; border-radius: 8px; cursor: pointer;">Add Admin</button>
    </form>
</section>

<section class="bus-section">
    <div class="section-heading">
        <p>CONTROL PANEL</p>
        <h2>Fleet Management</h2>
    </div>
    <div style="text-align: right; margin-bottom: 20px;">
        <a href="edit_bus.html" class="view-btn" style="text-decoration:none;">+ Add New Bus</a>
    </div>
    <div class="bus-container" id="admin-bus-list">
        <!-- Loaded via API -->
    </div>
</section>

<footer>
    <div class="footer-logo">🚌 BusGo</div>
    <p>Bus Ticket Reservation System</p>
    <p class="copyright">© 2026 BusGo. All Rights Reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('../api/get_buses.php')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('admin-bus-list');
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No buses found.</p>';
                return;
            }
            container.innerHTML = data.map(bus => `
                <div class="bus-card">
                    <div class="bus-image">🚌</div>
                    <div class="bus-details">
                        <div class="bus-title">
                            <h3>${bus.bus_name}</h3>
                            <span class="bus-type">ID: #${bus.bus_id}</span>
                        </div>
                        <p class="bus-number">${bus.source} → ${bus.destination}</p>
                        <div class="bus-info">
                            <span>Seats: ${bus.total_seats}</span>
                            <span>Fare: ₹${bus.fare}</span>
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
                            <a href="edit_bus.html?id=${bus.bus_id}" class="view-btn" style="text-decoration:none; background-color:#ffb703; color:#222; padding: 8px 12px; font-size: 0.9rem;">Edit</a>
                            <a href="book_ticket.html?bus_id=${bus.bus_id}" class="view-btn" style="text-decoration:none; background-color:#0b3d91; color:white; padding: 8px 12px; font-size: 0.9rem;">Book Ticket</a>
                            <button onclick="deleteBus(${bus.bus_id})" class="view-btn" style="background-color:#d90429; border:none; cursor:pointer; padding: 8px 12px; font-size: 0.9rem;">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
});

function createAdmin(e) {
    e.preventDefault();
    const payload = {
        username: document.getElementById('new_admin_username').value.trim(),
        password: document.getElementById('new_admin_password').value
    };

    fetch('../api/admin_create_admin.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            alert(data.message);
            document.getElementById('new_admin_username').value = '';
            document.getElementById('new_admin_password').value = '';
        } else {
            alert(data.message || 'Failed to create admin.');
        }
    })
    .catch(err => {
        console.error('Error:', err);
        alert('An error occurred while creating the admin account.');
    });
}

function deleteBus(id) {
    if(confirm('Are you sure you want to delete this bus?')) {
        fetch('../api/admin_delete_bus.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({bus_id: id})
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) { location.reload(); }
            else { alert('Failed to delete bus.'); }
        });
    }
}
</script>
</body>
</html>
