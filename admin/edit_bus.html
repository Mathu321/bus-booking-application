<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Edit Bus</title>
    <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>

<nav class="navbar">
    <div class="logo">🚌 BusGo Admin</div>
    <div class="nav-links">
        <a href="dashboard.html">Manage Buses</a>
        <a href="bookings.html">View Bookings</a>
        <a href="../public/index.html" class="nav-btn" style="background-color: #d90429;">Logout</a>
    </div>
</nav>

<section class="booking-section" style="max-width: 600px; margin: 40px auto; padding: 0 15px;">
    <div class="booking-form" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div class="booking-heading" style="text-align: center; margin-bottom: 20px;">
            <p style="color: #fca311; font-size: 0.85rem; font-weight: bold;">FLEET CONTROL</p>
            <h2 id="form-title" style="color: #0b3d91;">Add / Edit Bus</h2>
        </div>
        <form onsubmit="saveBus(event)" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="hidden" id="bus_id">
            
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Bus Name</label>
                <input type="text" id="bus_name" placeholder="Enter bus name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div class="input-row" style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Source</label>
                    <input type="text" id="source" placeholder="Departure city" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Destination</label>
                    <input type="text" id="destination" placeholder="Arrival city" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
            </div>

            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Departure Time</label>
                <input type="datetime-local" id="departure_time" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-row" style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Total Seats</label>
                    <input type="number" id="total_seats" value="40" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Fare (₹)</label>
                    <input type="number" step="0.01" id="fare" placeholder="0.00" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
            </div>

            <button type="submit" class="confirm-btn" style="width: 100%; background-color: #0b3d91; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px;">Save Bus Details</button>
        </form>
    </div>
</section>

<footer>
    <div class="footer-logo">🚌 BusGo</div>
    <p>Bus Ticket Reservation System</p>
    <p class="copyright">© 2026 BusGo. All Rights Reserved.</p>
</footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const busId = urlParams.get('id');

document.addEventListener("DOMContentLoaded", () => {
    if (busId) {
        document.getElementById('form-title').textContent = 'Edit Bus Details';
        fetch(`../api/get_bus_details.php?bus_id=${busId}`)
            .then(res => res.json())
            .then(data => {
                const b = data.bus;
                if(b) {
                    document.getElementById('bus_id').value = b.bus_id;
                    document.getElementById('bus_name').value = b.bus_name;
                    document.getElementById('source').value = b.source;
                    document.getElementById('destination').value = b.destination;
                    document.getElementById('departure_time').value = b.departure_time.replace(' ', 'T');
                    document.getElementById('total_seats').value = b.total_seats;
                    document.getElementById('fare').value = b.fare;
                }
            });
    }
});

function saveBus(e) {
    e.preventDefault();
    const payload = {
        bus_id: document.getElementById('bus_id').value || null,
        bus_name: document.getElementById('bus_name').value,
        source: document.getElementById('source').value,
        destination: document.getElementById('destination').value,
        departure_time: document.getElementById('departure_time').value.replace('T', ' '),
        total_seats: document.getElementById('total_seats').value,
        fare: document.getElementById('fare').value
    };

    fetch('../api/admin_save_bus.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = 'dashboard.html';
        } else {
            alert('Failed to save bus.');
        }
    });
}
</script>
</body>
</html>
