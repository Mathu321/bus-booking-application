<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="booking-section" style="max-width: 400px; margin: 100px auto;">
    <div class="booking-form">
        <div class="booking-heading" style="text-align: center;">
            <p>ADMIN PORTAL</p>
            <h2>Sign In</h2>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group" style="margin-bottom: 25px;">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="confirm-btn">Login</button>
        </form>
    </div>
</div>

<script>
function handleLogin(e) {
    e.preventDefault();
    fetch('../api/admin_login.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            window.location.href = 'dashboard.html';
        } else {
            alert(data.message);
        }
    });
}
</script>
</body>
</html>
