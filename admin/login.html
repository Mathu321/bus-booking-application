<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🚌 BusGo Admin</div>
    <div class="nav-links">
        <a href="dashboard.html">Manage Buses</a>
        <a href="bookings.html">View Bookings</a>
        <a href="../public/index.html" class="nav-btn" style="background-color: #d90429;">Logout</a>
    </div>
</nav>

<section class="bus-section">
    <div class="section-heading">
        <p>CONTROL PANEL</p>
        <h2>Fleet Management</h2>
    </div>
    <div style="text-align: right; margin-bottom: 20px;">
        <a href="edit_bus.html" class="view-btn" style="text-decoration:none;">+ Add New Bus</a>
    </div>
    <div class="bus-container" id="admin-bus-list">
        <!-- Loaded via API -->
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('../api/get_buses.php')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('admin-bus-list');
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No buses found.</p>';
                return;
            }
            container.innerHTML = data.map(bus => `
                <div class="bus-card">
                    <div class="bus-image">🚌</div>
                    <div class="bus-details">
                        <div class="bus-title">
                            <h3>${bus.bus_name}</h3>
                            <span class="bus-type">ID: #${bus.bus_id}</span>
                        </div>
                        <p class="bus-number">${bus.source} → ${bus.destination}</p>
                        <div class="bus-info">
                            <span>💺 ${bus.total_seats} Seats</span>
                            <span>💵 ₹${bus.fare}</span>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <a href="edit_bus.html?id=${bus.bus_id}" class="view-btn" style="text-decoration:none; background-color:#ffb703; color:#222;">Edit</a>
                            <button onclick="deleteBus(${bus.bus_id})" class="view-btn" style="background-color:#d90429; border:none; cursor:pointer;">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
});

function deleteBus(id) {
    if(confirm('Are you sure you want to delete this bus?')) {
        fetch('../api/admin_delete_bus.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({bus_id: id})
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) { location.reload(); }
            else { alert('Failed to delete bus.'); }
        });
    }
}
</script>
</body>
</html>
